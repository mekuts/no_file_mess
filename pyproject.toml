[project]
name = "no-file-mess"
version = "0.1.0"
description = "Catalog disks, plan identical-file cleanup and folder renames, and copy files another catalog is missing."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
]
dependencies = ["exifread>=3.5.1"]

[project.scripts]
no-file-mess = "no_file_mess.cli:main"

[project.urls]
Homepage = "https://github.com/mekuts/no_file_mess"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
